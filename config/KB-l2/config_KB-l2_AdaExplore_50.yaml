test_source: KB
agent_type: MCTS
level: 2
problem_id: 1
test_list_path: config/test_list/test_list_2.txt
dtype_str: fp32
gpu_name: RTX-4090-D
gpu_architecture: Ada
gpu_ids:
- 0
num_processes: 1  # 4
use_remote_eval: false
remote_eval_url: http://127.0.0.1:12017

