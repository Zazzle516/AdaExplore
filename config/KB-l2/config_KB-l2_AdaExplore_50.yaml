nsight_ncu_sudo: "Hello1234"        # sudo password used to run ncu as root
server_type: claude  # openai
model_name: claude-opus-4-7  # gpt-5-mini
max_completion_tokens: 16384

total_steps: 10
max_memory_round: 5
max_small_failures: 5
pool_size: 5
disable_reviewer: false

save_path: outputs/KB-l2_AdaExplore_50
general_memory_path: results/memory/general_memory_v1_200.txt
memory_update: false
knowledge_1_threshold: 5

debug: false
exploration_weight: 0.3
expand_exploration_ratio: 1.0
reward_alpha: 0.0
small_step_limit: 5
p_large: 0.2
pool_size_extra_max: 0
softmax_temperature: 1.0
dummy: false
geometric_p: 0.6